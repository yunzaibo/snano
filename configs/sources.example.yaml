schemaVersion: multi-source-config/v1
stations:
  gptge-main:
    kind: relay
    displayName: GPT.ge main relay
    baseUrl: https://api.gpt.ge
    vendorGroup: gptge-group
    enabled: true
    telemetry:
      balance: manual_or_low_frequency
      modelList: manual
    rateLimits:
      minTelemetryIntervalSeconds: 3600
      maxActiveProbesPerHour: 1
  aifast-vip:
    kind: relay
    displayName: AIFast VIP relay
    baseUrl: https://chat.aifast.site
    vendorGroup: aifast-group
    sourceTier: daily
    enabled: true
    telemetry:
      tokenPage: https://aifast.site/panel/token
      modelList: manual
    rateLimits:
      minTelemetryIntervalSeconds: 3600
      maxActiveProbesPerHour: 1
  aiwave-secondary:
    kind: relay
    displayName: Ai-Wave secondary relay
    baseUrl: https://api2.ai-wave.org/gemini
    vendorGroup: aiwave-group
    sourceTier: daily
    enabled: true
    telemetry:
      balance: manual_or_low_frequency
      modelList: manual
    rateLimits:
      minTelemetryIntervalSeconds: 3600
      maxActiveProbesPerHour: 1
  laozhang-main:
    kind: relay
    displayName: Laozhang API main relay
    baseUrl: https://api.laozhang.ai
    vendorGroup: laozhang-group
    sourceTier: professional
    enabled: true
    telemetry:
      modelList: manual
    rateLimits:
      minTelemetryIntervalSeconds: 3600
      maxActiveProbesPerHour: 1
accounts:
  gptge-primary:
    station: gptge-main
    accountGroup: gptge-paid-main
    enabled: true
    approvalPolicy:
      recharge: require_human_approval
  aifast-vip-account:
    station: aifast-vip
    enabled: true
    approvalPolicy:
      recharge: require_human_approval
  aiwave-primary:
    station: aiwave-secondary
    enabled: true
    approvalPolicy:
      recharge: require_human_approval
  laozhang-primary:
    station: laozhang-main
    enabled: true
    approvalPolicy:
      recharge: require_human_approval
credentials:
  gptge-primary-key:
    account: gptge-primary
    secretRef:
      type: env
      name: MIR_GPTGE_API_KEY
    authScheme: bearer
    enabled: true
  gptge-key3:
    account: gptge-primary
    secretRef:
      type: env
      name: MIR_GPTGE_KEY3_API_KEY
    authScheme: bearer
    headers:
      X-Api-User:
        type: env
        name: MIR_GPTGE_API_USER
    enabled: true
  aifast-vip-key:
    account: aifast-vip-account
    secretRef:
      type: env
      name: MIR_AIFAST_VIP_API_KEY
    authScheme: x-goog-api-key
    headers:
      New-Api-User:
        type: env
        name: MIR_AIFAST_API_USER
    enabled: true
  aiwave-primary-key:
    account: aiwave-primary
    secretRef:
      type: env
      name: MIR_AIWAVE_API_KEY
    authScheme: x-goog-api-key
    enabled: true
  laozhang-key3:
    account: laozhang-primary
    secretRef:
      type: env
      name: MIR_LAOZHANG_KEY3_API_KEY
    authScheme: bearer
    enabled: true
routes:
  gptge-openai-images:
    station: gptge-main
    adapterFamily: openai_images
    path: /v1/images/generations
    enabled: true
    requestDefaults:
      size: 4K
      aspect_ratio: 123
  aifast-gemini-v1beta:
    station: aifast-vip
    adapterFamily: gemini_generate_content
    path: /v1beta/models/{model}:generateContent
    enabled: true
    requestDefaults:
      responseModalities:
      - TEXT
      - IMAGE
  aiwave-gemini-native:
    station: aiwave-secondary
    adapterFamily: gemini_generate_content
    path: /v1beta/models/{model}:generateContent
    enabled: true
    requestDefaults:
      responseModalities:
      - TEXT
      - IMAGE
  laozhang-openai-images:
    station: laozhang-main
    adapterFamily: openai_images
    path: /v1/images/generations
    enabled: true
    requestDefaults:
      size: 4K
      aspect_ratio: 123
lanes:
  gptge-key3-main-openai-images:
    provider: gptge
    providerGroup: gptge-group
    sourceTier: daily
    station: gptge-main
    account: gptge-primary
    credential: gptge-key3
    route: gptge-openai-images
    poolIdentity: gptge-group/gptge-main/gptge-key3-main
    model: gemini-3-pro-image-preview
    capabilityBucket: T
    maxReferenceImages: 0
    maxConcurrency: 30
    priority: 20
    costTier: medium
    qualityTier: high
    enabled: true
    probePolicy:
      default: passive_first
      activeProbe: on_demand_only
  laozhang-key3-openai-images:
    provider: laozhang
    providerGroup: laozhang-group
    sourceTier: professional
    station: laozhang-main
    account: laozhang-primary
    credential: laozhang-key3
    route: laozhang-openai-images
    model: gemini-3-pro-image-preview
    capabilityBucket: T
    maxReferenceImages: 0
    maxConcurrency: 30
    priority: 30
    costTier: medium
    qualityTier: high
    enabled: true
    probePolicy:
      default: passive_first
      activeProbe: on_demand_only
  aifast-vip-v1beta:
    provider: aifast
    providerGroup: aifast-group
    sourceTier: daily
    station: aifast-vip
    account: aifast-vip-account
    credential: aifast-vip-key
    route: aifast-gemini-v1beta
    model: gemini-3-pro-image-preview-vip
    capabilityBucket: I1
    maxReferenceImages: 1
    maxConcurrency: 30
    priority: 40
    costTier: medium
    qualityTier: high
    enabled: true
    probePolicy:
      default: passive_first
      activeProbe: on_demand_only
  gptge-t2i-pro:
    provider: gptge
    providerGroup: gptge-group
    sourceTier: daily
    station: gptge-main
    account: gptge-primary
    credential: gptge-primary-key
    route: gptge-openai-images
    model: gemini-3-pro-image-preview
    capabilityBucket: T
    maxReferenceImages: 0
    maxConcurrency: 30
    priority: 50
    costTier: medium
    qualityTier: high
    enabled: true
    probePolicy:
      default: passive_first
      activeProbe: on_demand_only
  aiwave-t2i-pro:
    provider: aiwave
    providerGroup: aiwave-group
    sourceTier: daily
    station: aiwave-secondary
    account: aiwave-primary
    credential: aiwave-primary-key
    route: aiwave-gemini-native
    model: gemini-3-pro-image-preview
    capabilityBucket: T
    maxReferenceImages: 0
    maxConcurrency: 30
    priority: 40
    costTier: medium
    qualityTier: high
    enabled: true
    probePolicy:
      default: passive_first
      activeProbe: on_demand_only
routingPolicies:
  speed_first:
    mode: speed_first
    capabilityFilter: compatible
    race:
      groupAware: true
      maxGroups: 2
    health:
      skipCooldown: true
      allowStaleIfNoAlternatives: true
  fidelity_first:
    mode: fidelity_first
    capabilityFilter: compatible
    fallback:
      preferQualityTier: high
      allowReferenceDowngrade: false
    health:
      skipCooldown: true
