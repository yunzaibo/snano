schemaVersion: multi-source-config/v1
stations:
  apiyi-main:
    kind: relay
    displayName: Apiyi main relay
    baseUrl: https://api.apiyi.com/v1
    vendorGroup: apiyi-group
    sourceTier: professional
    enabled: true
  laozhang-main:
    kind: relay
    displayName: Laozhang API main relay
    baseUrl: https://api.laozhang.ai/v1
    vendorGroup: laozhang-group
    sourceTier: professional
    enabled: true
  gptge-main:
    kind: relay
    displayName: GPT.ge main relay
    baseUrl: https://api.gpt.ge
    vendorGroup: gptge-group
    sourceTier: daily
    enabled: true
  aifast-vip:
    kind: relay
    displayName: AIFast VIP relay
    baseUrl: https://aifast.site
    vendorGroup: aifast-group
    sourceTier: daily
    enabled: true
  aiwave-secondary:
    kind: relay
    displayName: Ai-Wave secondary relay
    baseUrl: https://www.ai-wave.org
    vendorGroup: aiwave-group
    sourceTier: daily
    enabled: true
  vectorengine-main:
    kind: relay
    displayName: VectorEngine main relay
    baseUrl: https://api.vectorengine.ai
    vendorGroup: vectorengine-group
    sourceTier: daily
    enabled: true
  rightcodes-main:
    kind: relay
    displayName: Right.codes main relay
    baseUrl: https://www.right.codes/draw
    vendorGroup: rightcodes-group
    sourceTier: professional
    enabled: true
  rightcodes-gemini:
    kind: relay
    displayName: Right.codes Gemini native relay
    baseUrl: https://right.codes/gemini
    vendorGroup: rightcodes-group
    sourceTier: professional
    enabled: true
  apimart-main:
    kind: relay
    displayName: ApiMart main relay
    baseUrl: https://api.apimart.ai
    vendorGroup: apimart-group
    sourceTier: professional
    enabled: true
accounts:
  apiyi-primary:
    station: apiyi-main
    accountGroup: apiyi-primary
    enabled: true
  apiyi-simage-image2-oss:
    station: apiyi-main
    accountGroup: image2Enterprise
    enabled: true
  laozhang-openclaw:
    station: laozhang-main
    accountGroup: laozhang-openclaw
    enabled: true
  gptge-primary:
    station: gptge-main
    accountGroup: gptge-primary
    enabled: true
  aifast-vip-account:
    station: aifast-vip
    accountGroup: aifast-vip
    enabled: true
  aiwave-primary:
    station: aiwave-secondary
    accountGroup: aiwave-primary
    enabled: true
  vectorengine-primary:
    station: vectorengine-main
    accountGroup: vectorengine-primary
    enabled: true
  rightcodes-primary:
    station: rightcodes-main
    accountGroup: rightcodes-primary
    enabled: true
  rightcodes-gemini-primary:
    station: rightcodes-gemini
    accountGroup: rightcodes-primary
    enabled: true
  apimart-primary:
    station: apimart-main
    accountGroup: apimart-primary
    enabled: true
credentials:
  apiyi-primary-key:
    account: apiyi-primary
    secretRef:
      type: env
      name: MIR_APIYI_API_KEY
    authScheme: bearer
    enabled: true
  apiyi-simage-image2-oss-key:
    account: apiyi-simage-image2-oss
    secretRef:
      type: env
      name: MIR_APIYI_SIMAGE_API_KEY
    authScheme: bearer
    enabled: true
  laozhang-openclaw-key:
    account: laozhang-openclaw
    secretRef:
      type: env
      name: MIR_LAOZHANG_API_KEY
    authScheme: bearer
    enabled: true
  gptge-primary-key:
    account: gptge-primary
    secretRef:
      type: env
      name: MIR_GPTGE_API_KEY
    authScheme: bearer
    headers:
      X-Api-User:
        type: env
        name: MIR_GPTGE_API_USER
    enabled: true
  aifast-vip-key:
    account: aifast-vip-account
    secretRef:
      type: env
      name: MIR_AIFAST_API_KEY
    authScheme: x-goog-api-key
    headers:
      New-Api-User:
        type: env
        name: MIR_AIFAST_API_USER
    enabled: true
  aiwave-primary-key:
    account: aiwave-primary
    secretRef:
      type: env
      name: MIR_AIWAVE_API_KEY
    authScheme: x-goog-api-key
    enabled: true
  vectorengine-primary-key:
    account: vectorengine-primary
    secretRef:
      type: env
      name: MIR_VECTORENGINE_API_KEY
    authScheme: x-goog-api-key
    headers:
      New-Api-User:
        type: env
        name: MIR_VECTORENGINE_API_USER
    enabled: true
  rightcodes-primary-key:
    account: rightcodes-primary
    secretRef:
      type: env
      name: MIR_RIGHTCODES_API_KEY
    authScheme: bearer
    enabled: true
  rightcodes-gemini-primary-key:
    account: rightcodes-gemini-primary
    secretRef:
      type: env
      name: MIR_RIGHTCODES_GEMINI_API_KEY
    authScheme: x-goog-api-key
    enabled: true
  apimart-primary-key:
    account: apimart-primary
    secretRef:
      type: env
      name: MIR_APIMART_API_KEY
    authScheme: bearer
    enabled: true
routes:
  openai-images:
    adapterFamily: openai_images
    path: /images/generations
    enabled: true
  openai-image-edits:
    adapterFamily: openai_images
    path: /images/edits
    enabled: true
  gptge-openai-images:
    station: gptge-main
    adapterFamily: openai_images
    path: /v1/images/generations
    enabled: true
  aifast-gemini-v1beta:
    station: aifast-vip
    adapterFamily: gemini_generate_content
    path: /v1beta/models/{model}:generateContent
    enabled: true
  apiyi-gemini-native:
    station: apiyi-main
    adapterFamily: gemini_generate_content
    baseUrl: https://api.apiyi.com
    path: /v1beta/models/{model}:generateContent
    enabled: true
  aiwave-gemini-native:
    station: aiwave-secondary
    adapterFamily: openai_images
    path: /v1/images/generations
    enabled: true
  vectorengine-chat-compat:
    station: vectorengine-main
    adapterFamily: openai_chat_images_compat
    path: /v1/chat/completions
    enabled: true
  vectorengine-openai-images:
    station: vectorengine-main
    adapterFamily: openai_images
    path: /v1/images/generations
    enabled: true
  rightcodes-chat-completions:
    station: rightcodes-main
    adapterFamily: openai_chat_images_compat
    path: /v1/chat/completions
    enabled: true
  rightcodes-openai-images:
    station: rightcodes-main
    adapterFamily: openai_images
    path: /v1/images/generations
    enabled: true
  rightcodes-gemini-native:
    station: rightcodes-gemini
    adapterFamily: gemini_generate_content
    path: /v1beta/models/{model}:generateContent
    enabled: true
  apimart-openai-images:
    station: apimart-main
    adapterFamily: openai_images
    path: /v1/images/generations
    enabled: true
  laozhang-gemini-native:
    station: laozhang-main
    adapterFamily: gemini_generate_content
    baseUrl: https://api.laozhang.ai
    path: /v1beta/models/{model}:generateContent
    enabled: true
lanes:
  apiyi-nano-banana-pro-4k:
    provider: apiyi
    providerGroup: apiyi-group
    sourceTier: professional
    station: apiyi-main
    account: apiyi-primary
    credential: apiyi-primary-key
    route: apiyi-gemini-native
    poolIdentity: apiyi-group/apiyi-main/nano-banana-pro-4k
    model: gemini-3-pro-image-preview
    modelClass: Snano
    defaultSize: 2k
    capabilityBucket: IM
    maxReferenceImages: 5
    maxConcurrency: 30
    preflightTimeoutSeconds: 8
    priority: 9
    enabled: true
  apiyi-primary-openai-images:
    provider: apiyi
    providerGroup: apiyi-group
    sourceTier: professional
    station: apiyi-main
    account: apiyi-primary
    credential: apiyi-primary-key
    route: openai-images
    poolIdentity: apiyi-group/apiyi-main/primary-openai-images
    model: gemini-3-pro-image-preview-4k
    modelClass: Snano
    defaultSize: 4k
    capabilityBucket: T
    maxReferenceImages: 0
    maxConcurrency: 30
    priority: 10
    enabled: true
  apiyi-simage-gpt-image-2:
    provider: apiyi
    providerGroup: apiyi-group
    sourceTier: professional
    station: apiyi-main
    account: apiyi-simage-image2-oss
    credential: apiyi-simage-image2-oss-key
    route: openai-image-edits
    poolIdentity: apiyi-group/apiyi-main/simage-gpt-image-2
    model: gpt-image-2
    modelClass: Simage
    defaultSize: 2k
    imageContract:
      textToImagePath: /images/generations
      requestFormat: multipart
      referenceField: image
      requestSizeMode: passthrough
      defaultSize: 2048x2048
      suppressFields:
      - aspect_ratio
    capabilityBucket: IM
    maxReferenceImages: 16
    maxConcurrency: 30
    priority: 11
    enabled: true
  laozhang-openclaw-openai-images:
    provider: laozhang
    providerGroup: laozhang-group
    sourceTier: professional
    station: laozhang-main
    account: laozhang-openclaw
    credential: laozhang-openclaw-key
    route: openai-images
    poolIdentity: laozhang-group/laozhang-main/openclaw-openai-images
    model: gemini-3-pro-image-preview
    modelClass: Snano
    defaultSize: 4k
    capabilityBucket: T
    maxReferenceImages: 0
    maxConcurrency: 30
    priority: 20
    enabled: true
  laozhang-nano-banana-pro-4k-i2i:
    provider: laozhang
    providerGroup: laozhang-group
    sourceTier: professional
    station: laozhang-main
    account: laozhang-openclaw
    credential: laozhang-openclaw-key
    route: laozhang-gemini-native
    poolIdentity: laozhang-group/laozhang-main/nano-banana-pro-4k-i2i
    model: gemini-3-pro-image-preview
    modelClass: Snano
    defaultSize: 2k
    capabilityBucket: IM
    maxReferenceImages: 14
    maxConcurrency: 30
    preflightTimeoutSeconds: 8
    priority: 20
    enabled: true
  laozhang-simage-gpt-image-2:
    provider: laozhang
    providerGroup: laozhang-group
    sourceTier: professional
    station: laozhang-main
    account: laozhang-openclaw
    credential: laozhang-openclaw-key
    route: openai-image-edits
    poolIdentity: laozhang-group/laozhang-main/simage-gpt-image-2
    model: gpt-image-2
    modelClass: Simage
    defaultSize: 2k
    imageContract:
      textToImagePath: /images/generations
      requestFormat: multipart
      referenceField: image
      requestSizeMode: passthrough
      defaultSize: 2048x2048
      suppressFields:
      - resolution
      - aspect_ratio
      resolutionBySize:
        2K: 2048x2048
        4K: 4096x4096
    capabilityBucket: IM
    maxReferenceImages: 5
    maxConcurrency: 30
    priority: 21
    enabled: true
  gptge-main-openai-images:
    provider: gptge
    providerGroup: gptge-group
    sourceTier: daily
    station: gptge-main
    account: gptge-primary
    credential: gptge-primary-key
    route: gptge-openai-images
    poolIdentity: gptge-group/gptge-main/primary-openai-images
    model: gemini-3-pro-image-preview
    capabilityBucket: T
    maxReferenceImages: 0
    maxConcurrency: 30
    priority: 30
    enabled: true
  aifast-vip-v1beta:
    provider: aifast
    providerGroup: aifast-group
    sourceTier: daily
    station: aifast-vip
    account: aifast-vip-account
    credential: aifast-vip-key
    route: aifast-gemini-v1beta
    poolIdentity: aifast-group/aifast-vip/vip-gemini
    model: gemini-3-pro-image-preview-vip
    capabilityBucket: I1
    maxReferenceImages: 1
    maxConcurrency: 30
    priority: 40
    enabled: true
  aiwave-secondary-gemini:
    provider: aiwave
    providerGroup: aiwave-group
    sourceTier: daily
    station: aiwave-secondary
    account: aiwave-primary
    credential: aiwave-primary-key
    route: aiwave-gemini-native
    poolIdentity: aiwave-group/aiwave-secondary/primary-gemini
    model: gemini-3-pro-image-preview
    capabilityBucket: T
    maxReferenceImages: 0
    maxConcurrency: 30
    priority: 50
    enabled: true
  vectorengine-compat-main:
    provider: vectorengine_compat
    providerGroup: vectorengine-group
    sourceTier: daily
    station: vectorengine-main
    account: vectorengine-primary
    credential: vectorengine-primary-key
    route: vectorengine-openai-images
    poolIdentity: vectorengine-group/vectorengine-main/primary-openai-images
    model: gemini-3.1-flash-image-preview
    capabilityBucket: T
    maxReferenceImages: 0
    maxConcurrency: 30
    priority: 60
    enabled: true
  rightcodes-gemini-chat:
    provider: rightcodes
    providerGroup: rightcodes-group
    sourceTier: professional
    station: rightcodes-main
    account: rightcodes-primary
    credential: rightcodes-primary-key
    route: rightcodes-chat-completions
    poolIdentity: rightcodes-group/rightcodes-main/gemini-chat
    model: gemini-3-pro-image-preview
    modelClass: Snano
    defaultSize: 4k
    capabilityBucket: T
    maxReferenceImages: 0
    maxConcurrency: 30
    priority: 70
    enabled: false
  rightcodes-gemini-images:
    provider: rightcodes
    providerGroup: rightcodes-group
    sourceTier: professional
    station: rightcodes-main
    account: rightcodes-primary
    credential: rightcodes-primary-key
    route: rightcodes-openai-images
    poolIdentity: rightcodes-group/rightcodes-main/gemini-images
    model: nano-banana-pro
    modelClass: Snano
    defaultSize: 4k
    imageContract:
      requestSizeMode: passthrough
      defaultSize: 4096x4096
      responseFormat: url
    capabilityBucket: T
    maxReferenceImages: 0
    maxConcurrency: 30
    priority: 70
    enabled: true
  rightcodes-nano-banana-pro-i2i:
    provider: rightcodes
    providerGroup: rightcodes-group
    sourceTier: professional
    station: rightcodes-main
    account: rightcodes-primary
    credential: rightcodes-primary-key
    route: rightcodes-openai-images
    poolIdentity: rightcodes-group/rightcodes-main/nano-banana-pro-i2i
    model: nano-banana-pro
    modelClass: Snano
    defaultSize: 1024px
    imageContract:
      requestSizeMode: passthrough
      defaultSize: 1024x1024
      responseFormat: url
      imageUrlsField: image
    capabilityBucket: I1
    maxReferenceImages: 1
    maxConcurrency: 30
    priority: 70
    enabled: true
  rightcodes-gemini-native:
    provider: rightcodes
    providerGroup: rightcodes-group
    sourceTier: professional
    station: rightcodes-gemini
    account: rightcodes-gemini-primary
    credential: rightcodes-gemini-primary-key
    route: rightcodes-gemini-native
    poolIdentity: rightcodes-group/rightcodes-gemini/gemini-native
    model: gemini-3-pro-image-preview
    modelClass: Snano
    defaultSize: 4k
    capabilityBucket: IM
    maxReferenceImages: 5
    maxConcurrency: 30
    priority: 70
    enabled: false
  rightcodes-gpt-image-2-chat:
    provider: rightcodes
    providerGroup: rightcodes-group
    sourceTier: professional
    station: rightcodes-main
    account: rightcodes-primary
    credential: rightcodes-primary-key
    route: rightcodes-chat-completions
    poolIdentity: rightcodes-group/rightcodes-main/gpt-image-2-chat
    model: gpt-image-2
    modelClass: Simage
    defaultSize: 1254px
    capabilityBucket: T
    maxReferenceImages: 0
    maxConcurrency: 30
    priority: 71
    enabled: true
  rightcodes-gpt-image-2-images:
    provider: rightcodes
    providerGroup: rightcodes-group
    sourceTier: professional
    station: rightcodes-main
    account: rightcodes-primary
    credential: rightcodes-primary-key
    route: rightcodes-openai-images
    poolIdentity: rightcodes-group/rightcodes-main/gpt-image-2-images
    model: gpt-image-2
    modelClass: Simage
    defaultSize: 2k
    imageContract:
      requestSizeMode: passthrough
      defaultSize: 2048x2048
      responseFormat: url
      imageUrlsField: image
      resolutionBySize:
        2K: 2048x2048
        4K: 4096x4096
    capabilityBucket: IM
    maxReferenceImages: 5
    maxConcurrency: 30
    priority: 72
    enabled: true
    degradationStatus: active
  apimart-gpt-image-2-images:
    provider: apimart
    providerGroup: apimart-group
    sourceTier: professional
    station: apimart-main
    account: apimart-primary
    credential: apimart-primary-key
    route: apimart-openai-images
    poolIdentity: apimart-group/apimart-main/gpt-image-2-images
    model: gpt-image-2
    modelClass: Simage
    defaultSize: 2k
    imageContract:
      requestSizeMode: aspect_ratio
      defaultSize: '1:1'
      defaultResolution: 2k
      resolutionBySize:
        2K: 2k
        4K: 4K
      pollPath: /v1/tasks/{task_id}
      pollQuery: language=zh
      pollInitialDelaySeconds: 15
      imageUrlsField: image_urls
    asyncRemote: true
    capabilityBucket: T
    maxReferenceImages: 0
    maxConcurrency: 30
    priority: 80
    enabled: true
  apimart-gpt-image-2-i2i:
    provider: apimart
    providerGroup: apimart-group
    sourceTier: professional
    station: apimart-main
    account: apimart-primary
    credential: apimart-primary-key
    route: apimart-openai-images
    poolIdentity: apimart-group/apimart-main/gpt-image-2-i2i
    model: gpt-image-2
    modelClass: Simage
    defaultSize: 2k
    imageContract:
      requestSizeMode: aspect_ratio
      defaultSize: '1:1'
      defaultResolution: 2k
      resolutionBySize:
        2K: 2k
        4K: 4K
      pollPath: /v1/tasks/{task_id}
      pollQuery: language=zh
      pollInitialDelaySeconds: 15
      imageUrlsField: image_urls
    asyncRemote: true
    capabilityBucket: IM
    maxReferenceImages: 16
    maxConcurrency: 30
    priority: 80
    enabled: true
  apimart-gemini-images:
    provider: apimart
    providerGroup: apimart-group
    sourceTier: professional
    station: apimart-main
    account: apimart-primary
    credential: apimart-primary-key
    route: apimart-openai-images
    poolIdentity: apimart-group/apimart-main/gemini-images
    model: gemini-3-pro-image-preview
    modelClass: Snano
    defaultSize: 2k
    imageContract:
      requestSizeMode: aspect_ratio
      defaultSize: '1:1'
      defaultResolution: 2K
      resolutionBySize:
        2K: 2K
        4K: 4K
      pollPath: /v1/tasks/{task_id}
      pollQuery: language=zh
      pollDeadlineSeconds: 150
      imageUrlsField: image_urls
    asyncRemote: true
    capabilityBucket: T
    maxReferenceImages: 0
    maxConcurrency: 30
    priority: 81
    enabled: true
  apimart-gemini-i2i:
    provider: apimart
    providerGroup: apimart-group
    sourceTier: professional
    station: apimart-main
    account: apimart-primary
    credential: apimart-primary-key
    route: apimart-openai-images
    poolIdentity: apimart-group/apimart-main/gemini-i2i
    model: gemini-3-pro-image-preview
    modelClass: Snano
    defaultSize: 2k
    imageContract:
      requestSizeMode: aspect_ratio
      defaultSize: '1:1'
      defaultResolution: 2K
      resolutionBySize:
        2K: 2K
        4K: 4K
      pollPath: /v1/tasks/{task_id}
      pollQuery: language=zh
      imageUrlsField: image_urls
      pollDeadlineSeconds: 150
    asyncRemote: true
    capabilityBucket: IM
    maxReferenceImages: 14
    maxConcurrency: 30
    priority: 81
    enabled: true
