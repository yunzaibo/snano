schemaVersion: routing-presets/v1
presets:
  snano:
    description: APIyi aggregate Gemini/Nano Banana variants.
    modelSelection: snano-v1
    providers:
    - apiyi-snano
    - apiyi-snano-gemini-3-pro-image
    - apiyi-snano-gemini-3-pro-image-preview
    - apiyi-snano-gemini-3-pro-image-preview-c
    maxRetriesPerProvider: 0
    routingPolicy: fallback
    providerTier: professional
    defaultSize: 2K
    artifactMinWidth: 2048
    artifactMinHeight: 2048
    artifactDimensionMode: long_edge
  simage:
    description: APIyi-only GPT Image 2.5 task-based model selection.
    modelSelection: simage-v1
    providers:
    - apiyi-simage-gpt-image-2-5-flare
    - apiyi-simage-gpt-image-2-5-sunburst
    maxRetriesPerProvider: 0
    routingPolicy: fallback
    providerTier: professional
    defaultSize: 2K
    artifactMinWidth: 2048
    artifactMinHeight: 2048
    artifactDimensionMode: long_edge
