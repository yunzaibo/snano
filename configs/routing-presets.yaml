schemaVersion: routing-presets/v1
presets:
  safe_apiyi_only:
    description: Only use Apiyi for controlled verification or cost isolation.
    providers:
    - apiyi-primary-openai-images
    routingPolicy: fallback
    maxRetriesPerProvider: 1
  safe_laozhang_only:
    description: Only use Laozhang for controlled verification or fallback isolation.
    providers:
    - laozhang-openclaw-openai-images
    routingPolicy: fallback
    maxRetriesPerProvider: 1
  pro_primary:
    description: Professional primary chain for formal generation.
    providers:
    - apiyi-primary-openai-images
    - laozhang-openclaw-openai-images
    routingPolicy: fallback
    providerTier: professional
    maxRetriesPerProvider: 1
    retryDelaySeconds: 2
    latencyBudgetSeconds: 60
    springBackSeconds: 300
    springBackProbeEvery: 4
  internal_balanced:
    description: Internal professional pool with recent-performance balancing.
    providers:
    - apiyi-primary-openai-images
    - laozhang-openclaw-openai-images
    routingPolicy: weighted_load_balance
    providerTier: professional
    latencyBudgetSeconds: 45
    maxRetriesPerProvider: 0
    springBackSeconds: 300
    springBackProbeEvery: 6
  safe_rightcodes_gemini:
    description: Only use Right.codes Nano Banana Pro professional images lane for
      connectivity smoke.
    providers:
    - rightcodes-gemini-images
    routingPolicy: fallback
    providerTier: professional
    maxRetriesPerProvider: 0
    latencyBudgetSeconds: 90
  safe_rightcodes_gpt_image_2:
    description: Only use Right.codes GPT-Image-2 professional images lane for connectivity
      smoke.
    providers:
    - rightcodes-gpt-image-2-images
    routingPolicy: fallback
    providerTier: professional
    maxRetriesPerProvider: 0
    latencyBudgetSeconds: 90
  safe_apiyi_simage_image2_oss:
    description: Only use APIyi image2Enterprise Simage official GPT-Image-2 image-to-image
      lane for 2K smoke.
    providers:
    - apiyi-simage-gpt-image-2
    routingPolicy: fallback
    providerTier: professional
    maxRetriesPerProvider: 0
    latencyBudgetSeconds: 90
  safe_apimart_gpt_image_2:
    description: Only use ApiMart GPT-Image-2 professional images lane for connectivity
      smoke.
    providers:
    - apimart-gpt-image-2-images
    routingPolicy: fallback
    providerTier: professional
    maxRetriesPerProvider: 0
    latencyBudgetSeconds: 90
  safe_apimart_gemini:
    description: Only use ApiMart Gemini professional images lane for connectivity
      smoke.
    providers:
    - apimart-gemini-images
    routingPolicy: fallback
    providerTier: professional
    maxRetriesPerProvider: 0
    latencyBudgetSeconds: 90
  pro_expanded_experimental:
    description: Professional expanded pool for post-smoke testing of Apiyi, Laozhang,
      Right.codes, and ApiMart.
    providers:
    - apiyi-primary-openai-images
    - laozhang-openclaw-openai-images
    - rightcodes-gemini-images
    - rightcodes-gpt-image-2-images
    - apimart-gpt-image-2-images
    - apimart-gemini-images
    routingPolicy: weighted_load_balance
    providerTier: professional
    latencyBudgetSeconds: 60
    maxRetriesPerProvider: 0
  snano:
    description: Operator-facing Snano professional 2K+ Nano Banana Pro production
      line.
    providers:
    - apiyi-nano-banana-pro-4k
    - laozhang-nano-banana-pro-4k-i2i
    - apimart-gemini-i2i
    routingPolicy: health_aware_load_balance
    providerTier: professional
    latencyBudgetSeconds: 300
    maxRetriesPerProvider: 0
    defaultSize: 2K
    artifactMinWidth: 2048
    artifactMinHeight: 2048
    artifactDimensionMode: long_edge
  snano_race:
    description: Race one Snano item across the professional 2K+ pool and keep the
      first valid result.
    providers:
    - apiyi-nano-banana-pro-4k
    - laozhang-nano-banana-pro-4k-i2i
    - apimart-gemini-i2i
    routingPolicy: speed_first
    providerTier: professional
    latencyBudgetSeconds: 300
    maxRetriesPerProvider: 0
    defaultSize: 2K
    artifactMinWidth: 2048
    artifactMinHeight: 2048
    artifactDimensionMode: long_edge
  snano_apiyi_only:
    description: Isolate APIyi Nano Banana Pro 4K on the official Gemini native contract.
    providers:
    - apiyi-nano-banana-pro-4k
    routingPolicy: fallback
    providerTier: professional
    latencyBudgetSeconds: 300
    maxRetriesPerProvider: 0
  professional_i2i_single_ref:
    description: Verified professional single-reference image-to-image pool with default
      2K+ long-edge acceptance.
    providers:
    - apiyi-nano-banana-pro-4k
    - laozhang-nano-banana-pro-4k-i2i
    - apimart-gemini-i2i
    routingPolicy: load_balance
    providerTier: professional
    latencyBudgetSeconds: 300
    maxRetriesPerProvider: 0
    defaultSize: 2K
    artifactMinWidth: 2048
    artifactMinHeight: 2048
    artifactDimensionMode: long_edge
  safe_laozhang_nano_banana_pro_4k_i2i:
    description: Isolate Laozhang native Gemini Nano Banana Pro image edit lane.
    providers:
    - laozhang-nano-banana-pro-4k-i2i
    routingPolicy: fallback
    providerTier: professional
    latencyBudgetSeconds: 300
    maxRetriesPerProvider: 0
    defaultSize: 4K
    artifactMinWidth: 4096
    artifactMinHeight: 4096
  safe_rightcodes_nano_banana_pro_i2i:
    description: Isolate Right.codes /draw Nano Banana Pro image edit reference-field
      contract.
    providers:
    - rightcodes-nano-banana-pro-i2i
    routingPolicy: fallback
    providerTier: professional
    latencyBudgetSeconds: 120
    maxRetriesPerProvider: 0
  safe_apimart_gemini_i2i:
    description: Isolate ApiMart Gemini Nano Banana Pro image edit lane.
    providers:
    - apimart-gemini-i2i
    routingPolicy: fallback
    providerTier: professional
    latencyBudgetSeconds: 300
    maxRetriesPerProvider: 0
    defaultSize: 4K
    artifactMinWidth: 4096
    artifactMinHeight: 4096
  safe_apimart_gpt_image_2_i2i:
    description: Isolate ApiMart GPT-Image-2 image edit lane.
    providers:
    - apimart-gpt-image-2-i2i
    routingPolicy: fallback
    providerTier: professional
    latencyBudgetSeconds: 180
    maxRetriesPerProvider: 0
  safe_laozhang_simage_gpt_image_2:
    description: Isolate Laozhang Simage GPT-Image-2 image edit lane.
    providers:
    - laozhang-simage-gpt-image-2
    routingPolicy: fallback
    providerTier: professional
    latencyBudgetSeconds: 180
    maxRetriesPerProvider: 0
    defaultSize: 2K
    artifactMinWidth: 2048
    artifactMinHeight: 2048
    artifactDimensionMode: long_edge
  snano_professional_4k:
    description: Legacy alias for snano strict professional 4K pool.
    providers:
    - apiyi-nano-banana-pro-4k
    - laozhang-nano-banana-pro-4k-i2i
    - apimart-gemini-i2i
    routingPolicy: load_balance
    providerTier: professional
    latencyBudgetSeconds: 300
    maxRetriesPerProvider: 0
    defaultSize: 4K
    artifactMinWidth: 4096
    artifactMinHeight: 4096
    artifactDimensionMode: long_edge
  simage:
    description: Operator-facing Simage professional 2K+ production line using GPT-Image-2
      lanes.
    providers:
    - apiyi-simage-gpt-image-2
    - laozhang-simage-gpt-image-2
    - apimart-gpt-image-2-i2i
    routingPolicy: health_aware_load_balance
    providerTier: professional
    latencyBudgetSeconds: 180
    maxRetriesPerProvider: 0
    defaultSize: 2K
    artifactMinWidth: 2048
    artifactMinHeight: 2048
    artifactDimensionMode: long_edge
  simage_professional_2k:
    description: Internal alias for the Simage professional 2K+ GPT-Image-2 production
      line.
    providers:
    - apiyi-simage-gpt-image-2
    - laozhang-simage-gpt-image-2
    - apimart-gpt-image-2-i2i
    routingPolicy: health_aware_load_balance
    providerTier: professional
    latencyBudgetSeconds: 180
    maxRetriesPerProvider: 0
    defaultSize: 2K
    artifactMinWidth: 2048
    artifactMinHeight: 2048
    artifactDimensionMode: long_edge
  simage_professional_1254:
    description: Legacy Simage daily model-class pool; not the default operator-facing
      Simage production line.
    providers:
    - laozhang-simage-gpt-image-2
    - rightcodes-gpt-image-2-images
    - apimart-gpt-image-2-images
    routingPolicy: weighted_load_balance
    providerTier: professional
    latencyBudgetSeconds: 120
    maxRetriesPerProvider: 0
  batch_draft:
    description: Daily/draft batch throughput preset using currently verified daily
      lanes.
    providers:
    - gptge-main-openai-images
    - aifast-vip-v1beta
    routingPolicy: weighted_load_balance
    providerTier: daily
    latencyBudgetSeconds: 75
    maxRetriesPerProvider: 0
  batch_draft_experimental:
    description: Daily/draft pool including experimental lanes for route diagnostics.
    providers:
    - gptge-main-openai-images
    - aifast-vip-v1beta
    - aiwave-secondary-gemini
    - vectorengine-compat-main
    routingPolicy: weighted_load_balance
    providerTier: daily
    latencyBudgetSeconds: 75
    maxRetriesPerProvider: 0
  speed_preview:
    description: Speed-first first-image preview; may consume multiple vendors for
      one item.
    providers:
    - apiyi-primary-openai-images
    - laozhang-openclaw-openai-images
    - gptge-main-openai-images
    routingPolicy: speed_first
    latencyBudgetSeconds: 30
    maxRetriesPerProvider: 0
